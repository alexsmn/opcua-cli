name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: opcua-cli-linux-x64
            archive_ext: tar.gz
          - os: macos-14
            artifact_name: opcua-cli-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: ../vcpkg

      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: >
          cmake -S . -B build/release
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/../vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/release --config Release

      - name: Stage package
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}/bin"
          cp build/release/opcua-cli "dist/${{ matrix.artifact_name }}/bin/"
          cp README.md LICENSE "dist/${{ matrix.artifact_name }}/"

      - name: Create archive
        run: tar -czf "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" -C dist "${{ matrix.artifact_name }}"

      - name: Create checksum
        run: shasum -a 256 "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
